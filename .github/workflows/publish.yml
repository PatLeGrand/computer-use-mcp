name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
    inputs:
      publish_npm:
        description: Publish the existing npm package
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: clippy,rustfmt
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            build-essential clang libclang-dev libdbus-1-dev libglib2.0-dev \
            libpipewire-0.3-dev libspa-0.2-dev libxkbcommon-dev pkg-config

      - name: Check Rust and guidance
        run: |
          cargo fmt --all -- --check
          bash scripts/check-guidance.sh
          cargo clippy --locked --workspace --all-features --all-targets -- -D warnings
          cargo test --locked --workspace --all-features

      - name: Build npm tarball
        run: npm pack

      - name: Test the packed plugin and MCP executable
        run: |
          mkdir -p target/npm-package-test
          tar -xzf patlegrand-computer-use-mcp-*.tgz -C target/npm-package-test
          COMPUTER_USE_MCP_PACKAGE_DIR=target/npm-package-test/package npm test
          python3 -B -m unittest discover -s scripts -p 'test_*.py'
          ldd target/npm-package-test/package/vendor/bin/computer-use-mcp

      - name: Checksum release package
        run: sha256sum patlegrand-computer-use-mcp-*.tgz > SHA256SUMS

      - uses: actions/upload-artifact@v7
        with:
          name: npm-package
          path: |
            patlegrand-computer-use-mcp-*.tgz
            SHA256SUMS
          if-no-files-found: error

  publish:
    if: inputs.publish_npm
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/download-artifact@v8
        with:
          name: npm-package
      - name: Publish with npm trusted publishing
        env:
          NPM_TAG: latest
        run: npm publish ./patlegrand-computer-use-mcp-*.tgz --access public --tag "$NPM_TAG"
